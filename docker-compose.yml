services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - microservices-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway-1
      - api-gateway-2
    networks:
      - microservices-network

  api-gateway-1:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-1
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: "1"
      JWT_SECRET: your-super-secret-jwt-key-2024
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      ORDER_SERVICE_URL: http://order-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - microservices-network

  api-gateway-2:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-2
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: "2"
      JWT_SECRET: your-super-secret-jwt-key-2024
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      ORDER_SERVICE_URL: http://order-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - microservices-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/orders_db
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservices-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      NODE_ENV: production
      PORT: 3002
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      NODE_ENV: production
      PORT: 3003
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservices-network

  email-function:
    build:
      context: ./email-faas
      dockerfile: Dockerfile
    container_name: email-function
    ports:
      - "8082:8080"
    labels:
      - "faas.function=true"
      - "faas.scale.min=0"
      - "faas.scale.max=10"
    networks:
      - microservices-network

  faas-connector:
    build:
      context: ./faas-connector
      dockerfile: Dockerfile
    container_name: faas-connector
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      OPENFAAS_GATEWAY: http://email-function:8080
      FUNCTION_NAME: ""
    depends_on:
      rabbitmq:
        condition: service_healthy
      email-function:
        condition: service_started
    networks:
      - microservices-network

  # =====================
  # MICRO-FRONTENDS
  # =====================

  mfe-shell:
    build:
      context: ./web-app/shell
      dockerfile: Dockerfile
    container_name: mfe-shell
    ports:
      - "5000:5000"
    environment:
      VITE_API_URL: http://localhost:8083/api
      VITE_WS_URL: http://localhost:8083
    depends_on:
      - mfe-orders
      - mfe-analytics
      - mfe-notifications
    networks:
      - microservices-network

  mfe-orders:
    build:
      context: ./web-app/orders-mfe
      dockerfile: Dockerfile
    container_name: mfe-orders
    ports:
      - "5001:5001"
    environment:
      VITE_API_URL: http://localhost:8083/api
    networks:
      - microservices-network

  mfe-analytics:
    build:
      context: ./web-app/analytics-mfe
      dockerfile: Dockerfile
    container_name: mfe-analytics
    ports:
      - "5002:5002"
    environment:
      VITE_API_URL: http://localhost:8083/api
    networks:
      - microservices-network

  mfe-notifications:
    build:
      context: ./web-app/notifications-mfe
      dockerfile: Dockerfile
    container_name: mfe-notifications
    ports:
      - "5003:5003"
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres_data: