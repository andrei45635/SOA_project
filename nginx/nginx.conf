events {
    worker_connections 1024;
}

http {
    # Upstream for API Gateway load balancing
    upstream api_gateway {
        least_conn;  # Load balancing algorithm
        server api-gateway-1:3000;
        server api-gateway-2:3000;
    }

    # Upstream for WebSocket connections (sticky sessions via Redis)
    upstream websocket_servers {
        ip_hash;  # Sticky sessions for WebSocket
        server api-gateway-1:3000;
        server api-gateway-2:3000;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        # API endpoints with load balancing
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            #proxy_pass http://api_gateway;
            proxy_pass http://api_gateway/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
#             add_header Access-Control-Allow-Origin * always;
#             add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
#             add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # WebSocket endpoint with sticky sessions
        location /ws {
            proxy_pass http://websocket_servers/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeout settings
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://api_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Static files / Web App (if served from nginx)
        location / {
           # proxy_pass http://web-app:8080;
            proxy_pass http://web-app:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}